<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- "Adicionar à Tela de Início" no iPhone abre como app, sem barra do Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prévia">
<meta name="theme-color" content="#F8F3EC">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Prévia de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3EC; --surface:#FFFDFA; --line:#EDE3D4; --gold:#D09C64; --gold-dark:#B8844A;
  --text:#3A3330; --text-2:#5C524C; --text-3:#8A7E76;
  --ok:#5E8B5A; --ok-bg:#E7F0E4; --warn:#B0673A; --warn-bg:#F8E6DA; --pend:#8A7E76; --pend-bg:#EFE9E1;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Roboto','Helvetica Neue',Arial,sans-serif;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* Comportamento de app (mesmo critério do CRM): sem zoom, sem arrastar a
   tela de lado, sem "elástico", sem destaque azul ao tocar, sem menu de
   salvar imagem ao segurar o dedo. */
html{touch-action:pan-x pan-y;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
body{touch-action:pan-x pan-y;overflow-x:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img,video{display:block;max-width:100%}
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
.wrap{max-width:1180px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

/* topo */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.top img{width:56px;height:56px;border-radius:50%;background:var(--surface);border:1px solid var(--line);object-fit:contain;padding:4px}
.top .t{flex:1;min-width:200px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);font-weight:500}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,40px);line-height:1.1}
.progress{min-width:220px}
.progress .n{font-size:13px;color:var(--text-2);margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)}

/* layout */
.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.tabs{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.list{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.list h2,.feed-head{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:500;padding:16px 16px 8px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 16px;border-top:1px solid var(--line)}
.item:hover{background:var(--bg)}
.item img{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--line);flex:none}
.item .meta{flex:1;min-width:0}
.item .tt{font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;white-space:nowrap;flex:none}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-pend{background:var(--pend-bg);color:var(--pend)}

/* feed estilo perfil */
.feed{max-width:640px;width:100%;justify-self:center}
.profile{display:flex;align-items:center;gap:16px;padding:20px 16px 16px}
.profile img{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);object-fit:contain;padding:6px;background:#fff}
.profile b{display:block;font-weight:500}
.profile span{font-size:13px;color:var(--text-3)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:0 0 3px}
.tile{position:relative;aspect-ratio:3/4;background:var(--line);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.tile:hover img{transform:scale(1.03)}
.tile .ico{position:absolute;top:8px;right:8px;width:20px;height:20px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.tile .dot{position:absolute;left:8px;bottom:8px}
.tile .date{position:absolute;left:0;right:0;top:0;padding:6px 8px;font-size:11px;color:#fff;background:linear-gradient(rgba(0,0,0,.45),transparent);text-align:left}
.note{font-size:13px;color:var(--text-3);padding:12px 16px 16px;line-height:1.5}

/* modal */
.modal{position:fixed;inset:0;background:rgba(40,32,28,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;touch-action:pan-y;overscroll-behavior:contain}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius);overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);max-width:1080px;width:100%;height:min(900px,calc(100dvh - 32px))}
.stage{position:relative;background:#1E1A18;min-height:0;overflow:hidden}
/* Carrossel nativo: a imagem acompanha o dedo e encaixa no slide */
.track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior:contain;touch-action:pan-x;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always}
.slide img,.slide video{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain}
.slide video{background:#000}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,253,250,.9);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text)}
.nav.prev{left:10px}.nav.next{right:10px}
.nav[hidden]{display:none}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:#fff}
.count{position:absolute;top:12px;right:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:12px}
.side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.side-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.side-h img{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);object-fit:contain;padding:2px;background:#fff}
.side-h .who{flex:1;font-size:14px;font-weight:500}
.side-h .who small{display:block;font-weight:400;color:var(--text-3);font-size:12px}
.x{width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--text-2)}
.x:hover{background:var(--bg)}
.side-b{padding:16px;overflow:auto;flex:1;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.side-b h3{font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.15;margin-bottom:12px}
.caption{white-space:pre-wrap;font-size:14px;line-height:1.6;color:var(--text-2)}
.copy{font-size:12px;color:var(--gold-dark);font-weight:500;margin-top:10px}
.side-f{border-top:1px solid var(--line);padding:14px 16px;background:var(--bg)}
.side-f .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.side-f .lbl{font-size:12px;color:var(--text-3)}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:11px 12px;border-radius:8px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.55;cursor:default}
textarea{width:100%;min-height:80px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:16px;/* 16px: o iPhone não dá zoom ao tocar no campo */color:var(--text);background:var(--surface);resize:vertical}
.last{font-size:12px;color:var(--text-2);margin-top:8px;line-height:1.5;white-space:pre-wrap}
.pnav{display:flex;justify-content:space-between;margin-top:10px}
.pnav button{font-size:12px;color:var(--text-3)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:14px}
  .tabs button.on{background:var(--text);color:#fff;border-color:var(--text)}
  .list{position:static;max-height:none}
  .layout[data-view=feed] .list,.layout[data-view=lista] .feed{display:none}
  .modal{padding:0;align-items:stretch}
  .sheet{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100%;border-radius:0;padding-top:env(safe-area-inset-top)}
  .stage{height:min(58dvh,calc(100vw * 1.25))}
  .side{border-left:0;min-height:0}
  /* No celular o painel inteiro rola junto (legenda + aprovação): nada fica preso atrás da barra do Safari */
  .side{overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
  .side-b{flex:none;overflow:visible}
  .side-f{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  textarea{min-height:72px}
  .nav{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="avatarTop" alt="">
    <div class="t">
      <div class="eyebrow" id="eyebrow">Prévia de conteúdo · aprovação</div>
      <h1 id="title"></h1>
    </div>
    <div class="progress">
      <div class="n" id="progressText"></div>
      <div class="bar"><i class="b-ok" id="barOk"></i><i class="b-warn" id="barWarn"></i></div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="on" data-view="feed">Feed</button>
    <button data-view="lista">Lista</button>
  </div>

  <div class="layout" id="layout" data-view="feed">
    <aside class="panel list" id="list"></aside>
    <section class="panel feed">
      <div class="profile">
        <img id="avatarFeed" alt="">
        <div><b id="profileName"></b><span id="profileHandle"></span></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="note" id="note"></p>
    </section>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="stage" id="stage">
      <div class="track" id="track"></div>
      <button class="nav prev" id="prev" aria-label="Anterior">‹</button>
      <button class="nav next" id="next" aria-label="Próximo">›</button>
      <span class="count" id="count"></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="side">
      <div class="side-h">
        <img id="avatarSide" alt="">
        <div class="who"><span id="sideHandle"></span><small id="sideMeta"></small></div>
        <button class="x" id="close" aria-label="Fechar">×</button>
      </div>
      <div class="side-b">
        <h3 id="mTitle"></h3>
        <div class="caption" id="mCaption"></div>
        <button class="copy" id="copyCaption">Copiar legenda</button>
      </div>
      <div class="side-f" id="approval"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"mes":"2026-11","slug":"2026-11-rytw23vq","titulo":"Novembro 2026","gerado":"2026-11-19T19:25:55.579Z","aprovacaoUrl":"https://script.google.com/macros/s/AKfycbzedfepmaGM4BoMudRKb39nfc1WjTc7qArPAbpYQYv7Fg5cNfGv5PG6GTK7fAXLJLUN/exec","perfil":{"nome":"Dra. Marcella Barros","instagram":"dramarcella.barros","avatar":"avatar.png"},"posts":[{"id":"01","data":"2026-11-21","horario":"","formato":"Carrossel","titulo":"Carrossel de teste","legenda":"","capa":"","midia":[{"tipo":"img","src":"m/01-1.jpg?v=3888b79d"},{"tipo":"img","src":"m/01-2.jpg?v=78705f3e"},{"tipo":"img","src":"m/01-3.jpg?v=e20b2cb4"},{"tipo":"img","src":"m/01-4.jpg?v=64107be7"},{"tipo":"img","src":"m/01-5.jpg?v=7919fbd8"},{"tipo":"img","src":"m/01-6.jpg?v=02f26275"}]},{"id":"02","data":"2026-11-24","horario":"19h00","formato":"Carrossel","titulo":"Toxina, caso real","legenda":"Repare no sorriso dela, antes e depois.\nÉ o mesmo.\n\nO que mudou foi a força de alguns músculos: ao redor dos olhos, na testa e entre as sobrancelhas.\n\nEssa é a parte que mais me importa na toxina: a expressão continua sendo sua.\nA ideia é que quem olhe perceba que você está bem, não que fez alguma coisa.\n\nResultado natural não é sorte.\nÉ dose pensada para o seu músculo, ponto escolhido pela sua expressão e revisão com calma.\n\nSalva este post para ter à mão na sua próxima avaliação.\nE se ficou alguma dúvida sobre toxina, me manda no direct.\n\n—\nToxina botulínica · registro 15 dias após a aplicação.\nDivulgação autorizada pelo usuário.\nEsta imagem não representa, em hipótese alguma, garantia de resultado. Cada ser humano tem características anatômicas e fisiológicas únicas.\n\nDra. Marcella Barros · Biomédica esteta · CRBM 39621 · Tatuí/SP\n\n#toxinabotulinica #botox #resultadonatural #biomedicinaestetica #esteticafacial #tatui #tatuisp","capa":"","midia":[{"tipo":"img","src":"m/02-1.jpg?v=9a0537de"},{"tipo":"img","src":"m/02-2.jpg?v=ed8ae36c"},{"tipo":"img","src":"m/02-3.jpg?v=1ec40a9d"},{"tipo":"img","src":"m/02-4.jpg?v=455b8639"},{"tipo":"img","src":"m/02-5.jpg?v=e3ee1693"},{"tipo":"img","src":"m/02-6.jpg?v=f0b3ef9d"},{"tipo":"img","src":"m/02-7.jpg?v=25300af9"},{"tipo":"img","src":"m/02-8.jpg?v=25350f5c"}]},{"id":"03","data":"2026-11-26","horario":"","formato":"Carrossel","titulo":"Manutenção custa caro","legenda":"Manutenção não é dinheiro jogado fora. Fechado?\n\n#biomedicinaestetica #esteticafacial #harmonizacaofacial #naturalidade #tatui","capa":"","midia":[{"tipo":"img","src":"m/03-1.jpg?v=19551769"},{"tipo":"img","src":"m/03-2.jpg?v=2ef294a0"},{"tipo":"img","src":"m/03-3.jpg?v=3e9c7d2f"},{"tipo":"img","src":"m/03-4.jpg?v=6cc25fec"},{"tipo":"img","src":"m/03-5.jpg?v=c4da4a34"},{"tipo":"img","src":"m/03-6.jpg?v=7d774b48"},{"tipo":"img","src":"m/03-7.jpg?v=661a7277"}]},{"id":"04","data":"2026-11-28","horario":"12h00","formato":"Reels","titulo":"Reels de teste","legenda":"Legenda de teste do reels.\nSegunda linha.","capa":"","midia":[{"tipo":"video","src":"m/04-1.mp4?v=fb61509c","poster":"m/04-1-poster.jpg?v=1640ecd1"}]}]};
const FMT_ICON = {
  Carrossel: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm-5 4h1v12a1 1 0 0 0 1 1h12v1H5a2 2 0 0 1-2-2V7z"/></svg>',
  Reels: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm4 5.5v7l6-3.5-6-3.5z"/></svg>'
};
const STATUS = {
  'Aprovado': {cls: 's-ok', label: '✓ Aprovado'},
  'Ajuste pedido': {cls: 's-warn', label: '✎ Ajuste pedido'},
  'Pendente': {cls: 's-pend', label: 'Aguardando'}
};
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const WEEK = ['dom','seg','ter','qua','qui','sex','sáb'];
const $ = (id) => document.getElementById(id);
let state = {};          // id do post -> {status, comentario, nome, em}
let current = null, slide = 0;

function fmtDate(iso, long) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return long ? `${WEEK[dt.getDay()]}, ${d} de ${MONTHS[m - 1]}` : `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
}
function statusOf(id) { return (state[id] && state[id].status) || 'Pendente'; }
function chip(id) { const s = STATUS[statusOf(id)] || STATUS.Pendente; return `<span class="chip ${s.cls}">${s.label}</span>`; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
function thumb(p) { return p.capa || (p.midia[0] && (p.midia[0].poster || p.midia[0].src)) || ''; }
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function render() {
  const posts = DATA.posts;
  const ok = posts.filter((p) => statusOf(p.id) === 'Aprovado').length;
  const warn = posts.filter((p) => statusOf(p.id) === 'Ajuste pedido').length;
  $('progressText').textContent = `${ok} de ${posts.length} aprovados` + (warn ? ` · ${warn} com ajuste` : '');
  $('barOk').style.width = (ok / posts.length * 100) + '%';
  $('barWarn').style.width = (warn / posts.length * 100) + '%';

  const byDate = [...posts].sort((a, b) => (a.data || '').localeCompare(b.data || '') || a.id.localeCompare(b.id));
  $('list').innerHTML = '<h2>Posts do mês, por data</h2>' + byDate.map((p) => `
    <button class="item" data-id="${esc(p.id)}">
      <img src="${esc(thumb(p))}" alt="" loading="lazy">
      <div class="meta"><div class="tt">${esc(p.titulo)}</div><div class="sub">${fmtDate(p.data)}${p.horario ? ' · ' + esc(p.horario) : ''} · ${esc(p.formato)}</div></div>
      ${chip(p.id)}
    </button>`).join('');

  // feed: como vai ficar no perfil, o mais recente primeiro
  $('grid').innerHTML = [...byDate].reverse().map((p) => `
    <button class="tile" data-id="${esc(p.id)}" aria-label="${esc(p.titulo)}">
      <img src="${esc(thumb(p))}" alt="" loading="lazy">
      <span class="date">${fmtDate(p.data)}</span>
      ${FMT_ICON[p.formato] ? `<span class="ico">${FMT_ICON[p.formato]}</span>` : ''}
      <span class="dot">${chip(p.id)}</span>
    </button>`).join('');
  document.querySelectorAll('[data-id]').forEach((el) => el.onclick = () => openPost(el.dataset.id));
}

function openPost(id) {
  current = DATA.posts.find((p) => p.id === id); slide = 0;
  $('mTitle').textContent = current.titulo;
  $('mCaption').textContent = current.legenda || '(sem legenda)';
  $('sideMeta').textContent = [fmtDate(current.data, true), current.horario, current.formato].filter(Boolean).join(' · ');
  buildTrack(); renderApproval();
  if (!$('modal').classList.contains('open')) lockPage(true);
  $('modal').classList.add('open');
}
function closePost() {
  $('modal').classList.remove('open'); lockPage(false);
  pauseVideos(); $('track').innerHTML = '';
  current = null;
}
// Trava o fundo com o modal aberto sem perder a posição (iPhone ignora overflow:hidden no body)
let lockedY = 0;
function lockPage(on) {
  if (on) { lockedY = window.scrollY; document.body.style.top = `-${lockedY}px`; document.body.classList.add('locked'); }
  else { document.body.classList.remove('locked'); document.body.style.top = ''; window.scrollTo(0, lockedY); }
}
function pauseVideos() { $('track').querySelectorAll('video').forEach((v) => v.pause()); }
function buildTrack() {
  const tr = $('track');
  tr.style.scrollBehavior = 'auto';
  tr.innerHTML = current.midia.map((m) => m.tipo === 'video'
    ? `<div class="slide"><video src="${esc(m.src)}" ${m.poster ? `poster="${esc(m.poster)}"` : ''} controls playsinline preload="metadata"></video></div>`
    : `<div class="slide"><img src="${esc(m.src)}" alt="" draggable="false"></div>`).join('');
  tr.scrollLeft = 0;
  requestAnimationFrame(() => { tr.style.scrollBehavior = ''; });
  slide = 0; updateSlideUi();
}
function updateSlideUi() {
  const n = current.midia.length;
  $('prev').hidden = slide === 0; $('next').hidden = slide >= n - 1;
  $('count').hidden = n < 2; $('count').textContent = `${slide + 1}/${n}`;
  $('dots').innerHTML = n > 1 ? current.midia.map((_, i) => `<i class="${i === slide ? 'on' : ''}"></i>`).join('') : '';
}
function go(d) {
  if (!current) return;
  const n = slide + d; if (n < 0 || n >= current.midia.length) return;
  const tr = $('track'); tr.scrollTo({left: n * tr.clientWidth});
}
$('track').addEventListener('scroll', () => {
  if (!current) return;
  const tr = $('track'), i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  if (i !== slide && i >= 0 && i < current.midia.length) { slide = i; pauseVideos(); updateSlideUi(); }
}, {passive: true});
function goPost(d) {
  const byDate = [...DATA.posts].sort((a, b) => (a.data || '').localeCompare(b.data || '') || a.id.localeCompare(b.id));
  const i = byDate.findIndex((p) => p.id === current.id) + d;
  if (byDate[i]) openPost(byDate[i].id);
}

function renderApproval() {
  const box = $('approval'), id = current.id, s = state[id];
  const nav = `<div class="pnav"><button id="pPrev">‹ Post anterior</button><button id="pNext">Próximo post ›</button></div>`;
  if (!DATA.aprovacaoUrl) {
    box.innerHTML = `<div class="row"><span class="lbl">Aprovação</span></div><p class="lbl">Responda pelo WhatsApp com o número do post (${esc(id)}).</p>${nav}`;
  } else {
    const st = statusOf(id);
    box.innerHTML = `
      <div class="row"><span class="lbl">Post ${esc(id)}</span>${chip(id)}</div>
      <div class="btns" id="mainBtns">
        <button class="btn ok" id="bOk" ${st === 'Aprovado' ? 'disabled' : ''}>✓ Aprovar</button>
        <button class="btn" id="bAdj">Pedir ajuste</button>
      </div>
      <div id="adjBox" hidden>
        <div class="btns"><button class="btn" id="bCancel">Cancelar</button><button class="btn ok" id="bSend">Enviar ajuste</button></div>
        <textarea id="adjText" placeholder="O que você gostaria de mudar neste post?"></textarea>
      </div>
      ${s && s.comentario ? `<div class="last"><b>Último pedido${s.nome ? ' de ' + esc(s.nome) : ''}:</b> ${esc(s.comentario)}</div>` : ''}
      ${nav}`;
    $('bOk').onclick = () => send('Aprovado', '');
    // Enviar fica ACIMA do campo e no lugar dos botões: com o teclado do
    // iPhone aberto, um botão abaixo do campo ficava escondido (teste 19/11).
    $('bAdj').onclick = () => { $('mainBtns').hidden = true; $('adjBox').hidden = false; $('adjText').focus(); };
    $('bCancel').onclick = () => { $('adjBox').hidden = true; $('mainBtns').hidden = false; };
    $('bSend').onclick = () => { const t = $('adjText').value.trim(); if (!t) { toast('Escreva o que deve mudar'); return; } send('Ajuste pedido', t); };
  }
  $('pPrev').onclick = () => goPost(-1); $('pNext').onclick = () => goPost(1);
}

async function send(status, comentario) {
  let nome = store('previa_nome');
  if (!nome) { nome = (prompt('Seu nome (fica registrado junto da aprovação):', '') || '').trim(); if (nome) store('previa_nome', nome); }
  const id = current.id;
  document.querySelectorAll('#approval .btn').forEach((b) => b.disabled = true);
  try {
    const r = await fetch(DATA.aprovacaoUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({mes: DATA.slug, post: id, titulo: current.titulo, status, comentario, nome})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'falha');
    state[id] = {status, comentario, nome, em: new Date().toISOString()};
    toast(status === 'Aprovado' ? 'Post aprovado' : 'Pedido de ajuste enviado');
    render(); if (current && current.id === id) renderApproval();
  } catch (e) {
    toast('Não foi possível salvar. Verifique a internet e tente de novo.');
    if (current) renderApproval();
  }
}

async function loadState() {
  if (!DATA.aprovacaoUrl) { $('note').textContent = 'Toque em um post para ver em tamanho real, com carrossel, vídeo e legenda.'; return; }
  $('note').textContent = 'Toque em um post para ver em tamanho real e aprovar ou pedir ajuste.';
  $('progressText').textContent = 'Carregando aprovações…';
  try {
    const r = await fetch(`${DATA.aprovacaoUrl}?mes=${encodeURIComponent(DATA.slug)}`);
    const j = await r.json();
    if (j.ok) state = j.itens || {};
  } catch (e) { /* sem rede: mostra tudo como aguardando */ }
  render();
}

// eventos
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('close').onclick = closePost;
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closePost(); });
document.addEventListener('keydown', (e) => {
  if (!current || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') closePost(); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
});
// iPhone: o Safari ignora user-scalable=no; bloqueia pinça e toque duplo para não dar zoom
['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), {passive: false}));
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 300 && !e.target.closest('textarea,video,button')) e.preventDefault();
  lastTouchEnd = now;
}, {passive: false});
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, {passive: false});
$('copyCaption').onclick = async () => { try { await navigator.clipboard.writeText(current.legenda || ''); toast('Legenda copiada'); } catch (e) { toast('Não foi possível copiar'); } };
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('layout').dataset.view = b.dataset.view;
});

// início
document.title = `${DATA.titulo} · Prévia`;
$('title').textContent = DATA.titulo;
['avatarTop', 'avatarFeed', 'avatarSide'].forEach((k) => $(k).src = DATA.perfil.avatar);
$('profileName').textContent = DATA.perfil.nome;
$('profileHandle').textContent = '@' + DATA.perfil.instagram;
$('sideHandle').textContent = DATA.perfil.instagram;
render(); loadState();
</script>
</body>
</html>
